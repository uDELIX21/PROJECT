name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (unit + integration + journeys + migration)
        run: python -m pytest -q
      - name: Alembic migration on scratch DB
        run: |
          rm -f /tmp/ci.db
          DATABASE_URL=sqlite:////tmp/ci.db python -m alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint || true   # advisory during development
      - run: npm test               # vitest: offline sync-engine unit tests
      - run: npm run build

  e2e:
    # Browser E2E (Phase 9): seeded backend + frontend + Playwright journeys
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: python -m playwright install --with-deps chromium
      - name: Seed + start backend
        run: |
          DATABASE_URL=sqlite:///./e2e.db python scripts/seed.py --reset
          SMS_STORAGE_DIR=./storage DATABASE_URL=sqlite:///./e2e.db \
            ARGON_TIME_COST=1 ARGON_MEMORY_COST_KIB=8192 \
            nohup python -m uvicorn app.main:app --port 8000 > backend.log 2>&1 &
      - name: Build + start frontend
        working-directory: frontend
        run: |
          npm run build
          nohup npm run start -- -p 3000 > frontend.log 2>&1 &
      - name: Wait for servers
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz && break || sleep 2
          done
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/login > /dev/null && break || sleep 2
          done
      - run: python -m pytest tests/e2e -v
